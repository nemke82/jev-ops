---
# ==============================================================================
# auto-remediate.yml — Confidence-gated safe SRE remediation with jev-ops
# ==============================================================================
- name: SRE Autonomous Diagnostics and Gated Remediation
  hosts: webservers
  gather_facts: false

  tasks:
    - name: Collect last 50 error journal entries
      ansible.builtin.shell: "journalctl -p err --since '-10m' -n 50"
      register: journal_output
      changed_when: false

    - name: Evaluate diagnostic health via jev-ops
      ansible.builtin.shell: "jev-ops analyze linux --json"
      args:
        stdin: "{{ journal_output.stdout }}"
      register: jev_result
      changed_when: false

    - name: Parse typed decisions
      ansible.builtin.set_fact:
        jev_decisions: "{{ jev_result.stdout | from_json }}"

    - name: Display diagnostic decision
      ansible.builtin.debug:
        msg: >
          Category: {{ jev_decisions.decisions.category.value }}
          (confidence {{ jev_decisions.decisions.category.confidence * 100 }}%),
          Severity: {{ jev_decisions.decisions.severity.value }}/5

    # POLICY GATE: Only auto-restart service if confidence is >= 95% and attention is required
    - name: Auto-remediate web service
      ansible.builtin.service:
        name: nginx
        state: restarted
      when:
        - jev_decisions.decisions.needs_attention.value == true
        - jev_decisions.decisions.category.value in ['application', 'filesystem']
        - (jev_decisions.decisions.category.confidence | float) >= 0.95

    # ESCALATION: Notify oncall if severity is high or model reports low confidence
    - name: Escalate to On-Call Slack channel
      ansible.builtin.uri:
        url: "{{ lookup('env', 'SLACK_WEBHOOK_URL') }}"
        method: POST
        body_format: json
        body:
          text: >
            🚨 High-severity incident detected on {{ inventory_hostname }}.
            Category: {{ jev_decisions.decisions.category.value }},
            Severity: {{ jev_decisions.decisions.severity.value }}/5.
      when:
        - (jev_decisions.decisions.severity.value | int) >= 4
