<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e551ba" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e551ba" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Shield Outer -->
  <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" 
           fill="#090d16" 
           stroke="url(#shieldGrad)" 
           stroke-width="3.5" 
           stroke-linejoin="round" />

  <!-- Inner Diagnostic Grid Accent -->
  <polygon points="32,12 50,22 50,42 32,52 14,42 14,22" 
           fill="rgba(229, 81, 186, 0.08)" 
           stroke="rgba(255, 255, 255, 0.12)" 
           stroke-width="1.5" 
           stroke-dasharray="3,3" />

  <!-- Radar Telemetry Pulses -->
  <line x1="32" y1="12" x2="32" y2="52" stroke="rgba(6, 182, 212, 0.35)" stroke-width="1.5" />
  <line x1="14" y1="32" x2="50" y2="32" stroke="rgba(6, 182, 212, 0.35)" stroke-width="1.5" />

  <!-- Decision Node Diamond Core -->
  <polygon points="32,22 42,32 32,42 22,32" 
           fill="url(#coreGrad)" 
           filter="url(#glow)" />
           
  <!-- Inner Center Core -->
  <circle cx="32" cy="32" r="3.5" fill="#090d16" />
</svg>
