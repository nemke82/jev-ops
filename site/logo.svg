<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 54" fill="none">
  <defs>
    <linearGradient id="logoShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#db2777" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="logoCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
  </defs>

  <!-- Hexagonal Shield Icon -->
  <g transform="translate(4, 3)">
    <!-- Hexagonal Shield Outer -->
    <polygon points="24,3 43,14 43,34 24,45 5,34 5,14" 
             fill="#0f172a" 
             stroke="url(#logoShieldGrad)" 
             stroke-width="2.8" 
             stroke-linejoin="round" />

    <!-- Inner Diagnostic Grid -->
    <polygon points="24,9 37,17 37,31 24,39 11,31 11,17" 
             fill="rgba(219, 39, 119, 0.12)" 
             stroke="rgba(255, 255, 255, 0.2)" 
             stroke-width="1" 
             stroke-dasharray="2,2" />

    <!-- Crosshair Axes -->
    <line x1="24" y1="9" x2="24" y2="39" stroke="rgba(2, 132, 199, 0.5)" stroke-width="1.2" />
    <line x1="11" y1="24" x2="37" y2="24" stroke="rgba(2, 132, 199, 0.5)" stroke-width="1.2" />

    <!-- Diamond Core -->
    <polygon points="24,16 32,24 24,32 16,24" 
             fill="url(#logoCoreGrad)" />
    <circle cx="24" cy="24" r="2.5" fill="#0f172a" />
  </g>

  <!-- Wordmark Typography: High contrast, larger and bold for crystal clear visibility -->
  <text x="58" y="30" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="26" letter-spacing="-0.03em" fill="#0f172a">
    jev<tspan fill="#db2777">-ops</tspan>
  </text>
  
  <text x="59" y="46" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="11" letter-spacing="0.12em" fill="#1e293b">
    SYSTEM ONE <tspan fill="#db2777">●</tspan> SRE
  </text>
</svg>
