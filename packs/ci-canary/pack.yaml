api_version: "jev-ops/v1"
kind: "DiagnosticPack"

metadata:
  name: "ci-canary"
  version: "0.1.0"
  description: "CI/CD canary deployment triage and automated rollback decision engine"
  author: "jev-ops"

spec:
  input:
    type: "text"
    max_bytes: 524288

  decisions:
    rollout_action:
      type: "choice"
      values:
        - promote
        - hold_and_watch
        - rollback
        - manual_override

    error_spike:
      type: "choice"
      values:
        - none
        - minor_tolerable
        - severe_5xx
        - latency_degradation
        - unknown

    risk_score:
      type: "score"
      min: 0
      max: 5
      levels:
        - "Canary matches or beats baseline on errors and latency"
        - "Negligible deviation from baseline, within normal noise"
        - "Small, tolerable regression in error rate or latency"
        - "Clear regression that warrants holding the rollout"
        - "Severe regression in 5xx rate or p99 latency; rollback advised"
        - "Canary is failing outright; roll back immediately"

    rollback_now:
      type: "boolean"

  instructions: |
    Analyze canary deployment metrics (e.g. 5xx error rate ratio between baseline and canary, p99 latency).
    Decide if the rollout is safe to promote across 100% of the fleet or must be halted and rolled back immediately.
