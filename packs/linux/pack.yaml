api_version: "jev-ops/v1"
kind: "DiagnosticPack"

metadata:
  name: "linux"
  version: "0.1.0"
  description: "General Linux diagnostic classification"
  author: "jev-ops"

spec:
  input:
    type: "text"
    max_bytes: 1048576

  decisions:
    health:
      type: "choice"
      values:
        - healthy
        - degraded
        - unhealthy
        - unknown

    category:
      type: "choice"
      values:
        - normal
        - cpu
        - memory
        - filesystem
        - network
        - application
        - security
        - hardware
        - unknown

    severity:
      type: "score"
      min: 0
      max: 5
      levels:
        - "Normal: no errors or anomalies in the signals"
        - "Informational: notable events with no impact on service"
        - "Minor: isolated errors or warnings with no user-visible impact"
        - "Degraded: partial impairment, elevated errors or latency for some users or requests"
        - "Serious: a major component is failing or most requests are affected; urgent action needed"
        - "Critical: outage, data loss or corruption risk, or active security compromise"

    needs_attention:
      type: "boolean"

  instructions: |
    Analyze the supplied Linux diagnostic information.

    Classify the overall health and primary problem category.

    Severity:
      0 = normal
      1 = informational
      2 = minor
      3 = degraded
      4 = serious
      5 = critical
