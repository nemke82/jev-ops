name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: jev-ops
            use_cross: false
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: jev-ops
            use_cross: false
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: jev-ops
            use_cross: true
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: jev-ops
            use_cross: false
            archive: tar.gz
          # Intel macOS runners are being retired; the Apple Silicon runner
          # cross-compiles x86_64 natively with the Xcode toolchain.
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: jev-ops
            use_cross: false
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: jev-ops.exe
            use_cross: false
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux musl target)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross (if cross compilation required)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          ARCHIVE_NAME="jev-ops-${{ github.ref_name }}-${{ matrix.target }}"
          STAGE_DIR="${ARCHIVE_NAME}"
          mkdir -p "${STAGE_DIR}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${STAGE_DIR}/"
          cp README.md LICENSE "${STAGE_DIR}/"
          cp -r packs "${STAGE_DIR}/"
          tar -czvf "${ARCHIVE_NAME}.tar.gz" "${STAGE_DIR}"
          # shasum ships on both Linux and macOS runners; sha256sum is GNU-only.
          shasum -a 256 "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
        shell: bash

      - name: Package archive (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $ARCHIVE_NAME = "jev-ops-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $ARCHIVE_NAME
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -Destination $ARCHIVE_NAME
          Copy-Item README.md, LICENSE -Destination $ARCHIVE_NAME
          Copy-Item -Recurse packs -Destination $ARCHIVE_NAME
          Compress-Archive -Path $ARCHIVE_NAME -DestinationPath "${ARCHIVE_NAME}.zip"
          (Get-FileHash "${ARCHIVE_NAME}.zip" -Algorithm SHA256).Hash.ToLower() + "  ${ARCHIVE_NAME}.zip" | Out-File -FilePath "${ARCHIVE_NAME}.zip.sha256" -Encoding ascii
        shell: powershell

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            jev-ops-${{ github.ref_name }}-${{ matrix.target }}.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
