name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: jev-ops
            asset_name: jev-ops-linux-x86_64
            aliases: ""
            use_cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: jev-ops
            asset_name: jev-ops-linux-x86_64-musl
            aliases: ""
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: jev-ops
            asset_name: jev-ops-linux-arm64
            aliases: "jev-ops-linux-aarch64"
            use_cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: jev-ops
            asset_name: jev-ops-macos-arm64
            aliases: ""
            use_cross: false
          # Intel macOS runners are being retired; the Apple Silicon runner
          # cross-compiles x86_64 natively with the Xcode toolchain.
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: jev-ops
            asset_name: jev-ops-macos-x86_64
            aliases: ""
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: jev-ops.exe
            asset_name: jev-ops-windows-x86_64.exe
            aliases: ""
            use_cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux musl target)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross (if cross compilation required)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Prepare standalone binary & checksum (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          PRIMARY="${{ matrix.asset_name }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${PRIMARY}"
          chmod +x "${PRIMARY}"
          shasum -a 256 "${PRIMARY}" > "${PRIMARY}.sha256"
          if [ -n "${{ matrix.aliases }}" ]; then
            for ALIAS in ${{ matrix.aliases }}; do
              cp "${PRIMARY}" "${ALIAS}"
              shasum -a 256 "${ALIAS}" > "${ALIAS}.sha256"
            done
          fi
        shell: bash

      - name: Prepare standalone binary & checksum (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $PRIMARY = "${{ matrix.asset_name }}"
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -Destination $PRIMARY
          (Get-FileHash $PRIMARY -Algorithm SHA256).Hash.ToLower() + "  $PRIMARY" | Out-File -FilePath "${PRIMARY}.sha256" -Encoding ascii
        shell: powershell

      - name: Upload Standalone Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            jev-ops-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
