name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: jev-ops
            use_cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: jev-ops
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: jev-ops
            use_cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: jev-ops
            use_cross: false
          # Intel macOS runners are being retired; the Apple Silicon runner
          # cross-compiles x86_64 natively with the Xcode toolchain.
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: jev-ops
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: jev-ops.exe
            use_cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux musl target)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross (if cross compilation required)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Prepare standalone binary & checksum (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          RAW_BINARY="jev-ops-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${RAW_BINARY}"
          chmod +x "${RAW_BINARY}"
          shasum -a 256 "${RAW_BINARY}" > "${RAW_BINARY}.sha256"
        shell: bash

      - name: Prepare standalone binary & checksum (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $RAW_BINARY = "jev-ops-${{ matrix.target }}.exe"
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -Destination $RAW_BINARY
          (Get-FileHash $RAW_BINARY -Algorithm SHA256).Hash.ToLower() + "  $RAW_BINARY" | Out-File -FilePath "${RAW_BINARY}.sha256" -Encoding ascii
        shell: powershell

      - name: Upload Standalone Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            jev-ops-${{ matrix.target }}*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
